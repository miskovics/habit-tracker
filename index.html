<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>HABIT TRACKER</h1>
    <button id="theme-toggle"></button>
    <button id="new-day">New day</button>
    <ul id="habits"></ul>
    <input id="new-title" type="text" placeholder="Habit title, then press Enter" hidden>
    <button id="new-habit">New habit</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
